<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RefyrdSnake</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Flex:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=6">
</head>
<body data-color="green">

    <canvas id="confettiCanvas"></canvas>

    <div class="branding">
        <div class="name">Refyrd</div>
        <div class="vibe">vibecode</div>
    </div>

    <div class="header">
        <div class="score-box" style="display:flex; align-items:center; gap:8px;">
            <a href="../" class="icon-btn" id="uiBackBtn" title="Все игры" style="text-decoration:none;">←</a>
            <div>
                <div class="score-title" id="uiScoreTitle">Счет</div>
                <div class="score-value" id="score">0</div>
            </div>
        </div>
        <a href="https://github.com/Refyrd/Refyrd.github.io" target="_blank" class="header-github">GitHub</a>
        <div class="header-actions">
            <button class="icon-btn" id="authBtn" title="Sign in">👤</button>
            <button class="icon-btn" id="langToggle">EN</button>
            <button class="icon-btn" id="themeToggle">☀️</button>
        </div>
    </div>

    <div class="game-container" id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div class="overlay active" id="startMenu">
            <div class="menu-inner">
                <div class="menu-title" id="uiMainTitle">ЗМЕЙКА</div>
                <div class="high-score" id="menuHighScoreText">Лучший счет: 0</div>
                <div class="last-score" id="menuLastScoreText">Последний счет: 0</div>
                
                <input type="text" id="playerNameInput" class="name-input" placeholder="Твой никнейм" maxlength="12" autocomplete="off">

                <div class="size-picker">
                    <button class="size-btn" data-size="10">10x10</button>
                    <button class="size-btn active" data-size="20">20x20</button>
                    <button class="size-btn" data-size="40">40x40</button>
                </div>

                <div class="color-picker">
                    <button class="color-btn active" data-c="green" style="background-color: #4CAF50;"></button>
                    <button class="color-btn" data-c="blue" style="background-color: #2196F3;"></button>
                    <button class="color-btn" data-c="red" style="background-color: #F44336;"></button>
                    <button class="color-btn" data-c="purple" style="background-color: #9C27B0;"></button>
                </div>
                <div class="button-group">
                    <button class="btn-primary" id="uiPlayBtn">Играть</button>
                    <a href="../" class="btn-secondary" id="uiSnakeToHubBtn" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">Все игры</a>
                </div>
            </div>
        </div>

        <div class="overlay" id="gameOverScreen">
            <div class="menu-inner">
                <div class="menu-title" id="uiGameOverTitle" style="color: var(--md-sys-color-error)">Конец игры</div>
                <div class="high-score"><span id="uiFinalScoreText">Счет: </span><span id="finalScore">0</span></div>
                
                <div class="button-group">
                    <button class="btn-primary" id="uiRestartBtn">Начать заново</button>
                    <button class="btn-secondary" id="uiMenuBtn">В меню</button>
                    <a href="../" class="btn-secondary" id="uiGameOverToHubBtn" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">Все игры</a>
                </div>
            </div>
        </div>

        <div id="devMenu">
            <div class="menu-title" id="uiDevTitle">DEV</div>
            <div class="high-score">Refyrd.dev</div>
            
            <div class="button-group">
                <button class="btn-secondary" id="uiDevConfetti">Конфетти</button>
                <button class="btn-secondary" id="uiDevGlow">Свечение змеи</button>
                <button class="btn-secondary" id="uiDevAddScore">+10 очков</button>
                <button class="btn-secondary" id="uiDevFill">Длинная змейка</button>
                <button class="btn-primary" id="uiDevClose">Закрыть</button>
            </div>
        </div>
    </div>

    <div class="leaderboard" id="leaderboard">
        <h3 id="lbTitle">LEADERBOARD</h3>
        <div class="lb-list" id="lbList">
            <div class="lb-loading" id="lbLoadingText">Загрузка...</div>
        </div>
        <button class="lb-show-more" id="lbShowMore">Все</button>
        <div class="lb-status" id="lbStatus"><span class="dot"></span><span>Подключение...</span></div>
    </div>

    <div id="feedbackPanel">
        <h3 id="fbTitle">ОТЗЫВЫ</h3>
        <div class="feedback-list" id="fbList">
            <div class="lb-loading">Загрузка...</div>
        </div>
        <button class="btn-primary fb-write-btn" id="fbWriteBtn">Написать отзыв</button>
    </div>

    <div class="auth-overlay" id="fbOverlay">
        <div class="auth-modal">
            <button class="auth-close" id="fbClose">&times;</button>
            <div class="auth-title">Написать отзыв</div>
            <input type="text" class="name-input" id="fbNameInput" placeholder="Ваше имя" maxlength="12" autocomplete="off">
            <textarea class="fb-textarea" id="fbMessageInput" placeholder="Напишите, что вы думаете об игре..." maxlength="500"></textarea>
            <div class="auth-status" id="fbStatus"></div>
            <button class="btn-primary fb-submit-btn" id="fbSubmit">Отправить</button>
        </div>
    </div>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <button class="auth-close" id="authClose">&times;</button>
            
            <div id="authMainView">
                <div class="auth-title" id="authTitle">Войти</div>
                <div class="auth-status" id="authStatus"></div>
                
                <div class="auth-social">
                    <button class="auth-social-btn" id="authGoogle">
                        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
                        <span>Google</span>
                    </button>
                    <button class="auth-social-btn" id="authGithub">
                        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                        <span>GitHub</span>
                    </button>
                    <div class="auth-divider"><span>или</span></div>
                    <button class="auth-social-btn auth-email-btn" id="authEmailBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
                        <span>Войти через Email</span>
                    </button>
                </div>
            </div>

            <div id="authEmailView" style="display: none;">
                <button class="auth-back" id="authEmailBack">&larr; Назад</button>
                <div class="auth-title" id="authEmailTitle">Email</div>
                <div class="auth-status" id="authEmailStatus"></div>
                <input type="email" class="name-input" id="authEmail" placeholder="Эл. почта" autocomplete="email">
                <input type="password" class="name-input" id="authPassword" placeholder="Пароль" autocomplete="current-password">
                <input type="text" class="name-input" id="authRegNick" placeholder="Никнейм" maxlength="12" style="display: none;">
                <div style="display: flex; gap: 8px; width: 100%;">
                    <button class="btn-primary" id="authEmailSignIn" style="flex: 1;">Войти</button>
                    <button class="btn-secondary" id="authEmailRegister" style="flex: 1;">Регистрация</button>
                </div>
            </div>

            <div id="authAccountView" style="display: none;">
                <div class="auth-title">Аккаунт</div>
                <div class="auth-status" id="authAccStatus"></div>
                <div class="auth-info-line" id="authAccEmail"></div>
                <div class="auth-acc-section">
                    <div class="auth-acc-label">Привязанные провайдеры</div>
                    <div class="auth-providers" id="authProvidersList"></div>
                </div>
                <div class="auth-acc-section" id="authLinkSection">
                    <div class="auth-acc-label">Привязать другой</div>
                    <div class="auth-providers" id="authLinkButtons"></div>
                </div>
                <div class="auth-acc-section">
                    <div class="auth-acc-label">Никнейм</div>
                    <div style="display: flex; gap: 6px; width: 100%;">
                        <input type="text" class="name-input" id="authAccNick" placeholder="Никнейм" maxlength="12" style="flex: 1;">
                        <button class="btn-primary" id="authAccNickSave" style="padding: 0 16px; font-size: 13px;">Сохранить</button>
                    </div>
                </div>
                <button class="btn-secondary" id="authSignOut" style="width: 100%; margin-top: 8px;">Выйти</button>
            </div>

            <div id="authLinkEmailView" style="display: none;">
                <button class="auth-back" id="authLinkEmailBack">&larr; Назад</button>
                <div class="auth-title">Привязать Email</div>
                <div class="auth-status" id="authLinkEmailStatus"></div>
                <input type="email" class="name-input" id="authLinkEmail" placeholder="Эл. почта" autocomplete="email">
                <input type="password" class="name-input" id="authLinkPassword" placeholder="Пароль" autocomplete="new-password">
                <button class="btn-primary" id="authLinkEmailLink" style="width: 100%;">Привязать</button>
            </div>
        </div>
    </div>

    <script src="../i18n.js"></script>
    <script src="../profanity.js"></script>
    <script src="snake.js"></script>
</body>
</html>
