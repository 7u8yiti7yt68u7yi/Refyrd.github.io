<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        var path = (window.location.pathname || '').toLowerCase();
        if (path.includes('snake')) {
            window.location.replace('/snake');
        } else if (path.includes('bullet') || path.includes('danmaku') || path.includes('hell')) {
            window.location.replace('/bullet-hell');
        } else {
            window.location.replace('/');
        }
    </script>
</head>
<body>
</body>
</html>
